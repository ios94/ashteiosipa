
name: Update Ashte JSON

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ashte-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          TARGET_URL: https://check0ver.net/en
          PYTHONUNBUFFERED: "1"
        run: python -u scrape.py

      - name: Validate JSON
        run: |
          python -m json.tool ashte.json > /dev/null
          python -c "import json; d=json.load(open('ashte.json')); assert d['count'] > 0; print('Games:', d['count']); print('Downloads:', d['download_count'])"

      - name: Commit Changes
        run: |
          git config user.name "AshteMobile Bot"
          git config user.email "bot@users.noreply.github.com"
          git add ashte.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Ashte JSON"
            git push
          fi
